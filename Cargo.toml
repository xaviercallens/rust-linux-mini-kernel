[workspace]
resolver = "2"
members = [
    "crates/*",
    "examples/micro_kernel_demo",
    # Memory Management modules
    "crates/page_alloc",
    "crates/slab",
    "crates/vmalloc",
    "crates/page_table",
    "crates/slub",
    "crates/mmap",
    "crates/mprotect",
    "crates/mremap",
    "crates/mlock",
    "crates/munmap",
    "crates/memblock",
    "crates/mempool",
    "crates/percpu",
    "crates/init_mm",
    "crates/util",
    "crates/swap",
    "crates/swapfile",
    "crates/page_io",
    "crates/oom_kill",
    "crates/kasan",
    "crates/rmap",
    "crates/vmscan",
    "crates/migrate",
    "crates/compaction",
    "crates/page_owner",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Linux Kernel Contributors", "Socrate AI"]
license = "GPL-2.0"

[workspace.dependencies]
libc = "0.2"

[profile.dev]
opt-level = 0
panic = "abort"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
