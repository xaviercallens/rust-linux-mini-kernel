name: Formal Verification Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  static-analysis:
    name: Rust 110/100 Standards (Clippy)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: clippy
    - name: Run Cargo Check (No STD)
      run: cargo check --workspace
    - name: Run Strict Pedantic Clippy
      run: cargo clippy --workspace -- -D clippy::all -D clippy::pedantic

  qemu-fuzz:
    name: QEMU Baremetal Integration Tests
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
    - uses: actions/checkout@v3
    - name: Install QEMU
      run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
    - name: Install Rust Nightly
      uses: dtolnay/rust-toolchain@nightly
    - name: Run QEMU Harness Fuzzing
      run: bash scripts/run_qemu_harness.sh --ci

  lean-formalization:
    name: Lean 4 Mathematical Proofs
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
    - uses: actions/checkout@v3
    - name: Install Elan (Lean version manager)
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
        echo "$HOME/.elan/bin" >> $GITHUB_PATH
    - name: Run Lake Build (Verify Proofs)
      working-directory: ./specs/lean4
      run: lake build
