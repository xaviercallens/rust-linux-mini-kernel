name: V9.4.0 Runtime & Integration Tests (QEMU & Fuzzing)

on:
  push:
    branches: [ main, mvk-alpha ]
  pull_request:
    branches: [ main, mvk-alpha ]

jobs:
  runtime-tests:
    name: Build, Boot & Fuzz Integration Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Nightly with Target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          targets: i686-unknown-linux-gnu
          components: rust-src

      - name: Install QEMU System Emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache Cargo Registry and Build Assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-runtime-

      - name: Check Workspace Compilation (no_std modules)
        run: cargo check --workspace

      - name: Check Fuzz Targets Compilation
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Build x86_64 Bare Metal Kernel
        run: |
          cd examples/demo_kernel && cargo build --release
        continue-on-error: true

      - name: Execute QEMU Full System Emulation Boot Test
        if: success()
        run: |
          KERNEL_BIN=$(find examples/demo_kernel/target -name demo_kernel -type f 2>/dev/null | head -1)
          if [ -n "$KERNEL_BIN" ]; then
            python3 scripts/qemu_boot_test.py --kernel "$KERNEL_BIN" --timeout 15.0
          else
            echo "Kernel binary not found, skipping QEMU boot test"
          fi
        continue-on-error: true

      - name: Install cargo-fuzz
        run: |
          cargo install cargo-fuzz || true

      - name: Run Fuzzing Targets
        run: |
          chmod +x scripts/run_fuzzing.sh
          ./scripts/run_fuzzing.sh fuzz_routing 30
          ./scripts/run_fuzzing.sh fuzz_packet 30
        continue-on-error: true

      - name: Run C vs Rust Microbenchmark Comparison
        run: |
          python3 benchmarks/c_vs_rust_perf_report.py --results-dir benchmarks/results
        continue-on-error: true

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30
