name: V9.4.0 Runtime & Integration Tests (QEMU & Fuzzing)

on:
  push:
    branches: [ main, mvk-alpha ]
  pull_request:
    branches: [ main, mvk-alpha ]

jobs:
  runtime-tests:
    name: Build, Boot & Fuzz Integration Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust Nightly with Target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-15
          targets: i686-unknown-linux-gnu

      - name: Install QEMU System Emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: Cache Cargo Registry and Build Assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
            fuzz/target/
          key: ${{ runner.os }}-cargo-runtime-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-runtime-

      - name: Check Workspace Compilation (no_std modules)
        run: cargo check --workspace

      - name: Check Fuzz Targets Compilation
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Build x86_64 Bare Metal Kernel
        run: |
          cd examples/demo_kernel && cargo build --release

      - name: Execute QEMU Full System Emulation Boot Test
        run: |
          python3 scripts/qemu_boot_test.py --kernel examples/demo_kernel/target/i686-unknown-linux-gnu/release/demo_kernel --timeout 15.0

      - name: Execute QEMU Stress Test (Concurrency)
        run: |
          python3 scripts/stress_test_qemu.py --kernel examples/demo_kernel/target/i686-unknown-linux-gnu/release/demo_kernel --concurrency 5

      - name: Install cargo-fuzz
        run: |
          rustup toolchain install stable
          cargo +stable install cargo-fuzz || true

      - name: Run Fuzzing Targets
        run: |
          ./scripts/run_fuzzing.sh fuzz_routing 30
          ./scripts/run_fuzzing.sh fuzz_packet 30

      - name: Run C vs Rust Microbenchmark Comparison
        run: |
          python3 benchmarks/c_vs_rust_perf_report.py --results-dir benchmarks/results

      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/
          retention-days: 30
