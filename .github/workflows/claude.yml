name: Claude (maintainer-triggered)

# Triggered by `@claude` in a comment, or by a maintainer applying the
# `agent:claude` label to an issue. claude-code-action only runs for users with
# write access, so outside contributors cannot launch it with a prompt they
# control. Claude reads CLAUDE.md -> AGENTS.md for the project's evidence rules.
# Before tagging Claude on an outside PR, read the raw diff: PR text is untrusted
# input (see the action's security docs on prompt injection).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [labeled]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "agent:claude"
          claude_args: |
            --max-turns 40
