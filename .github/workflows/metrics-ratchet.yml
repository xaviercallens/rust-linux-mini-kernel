name: Metrics Ratchet

# Static-analysis truth gate for the v12 plan
# (docs/roadmap/RUNUX_V12_VERIFIED_CORE_PLAN.md, section 2 and WS0).
#
# Computes scripts/metrics.py's metrics from the tree as-is (no cargo/lake
# build required -- see scripts/rust_tools.py and scripts/lean_tools.py for
# why that tradeoff was made) and fails the PR if any "lower is better" or
# "higher is better" metric moved the wrong way relative to
# docs/roadmap/metrics/metrics.baseline.json.
#
# The baseline is never updated automatically. It only changes via a
# reviewed commit that runs `scripts/metrics.py snapshot-baseline` by hand
# -- see that script's docstring and the plan's "anti-cheat" section (4.2).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  metrics-ratchet:
    name: Metrics ratchet (no regressions vs. baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Measure current metrics
        run: python3 scripts/metrics.py measure --out metrics-current.json --md metrics-current.md

      - name: Upload metrics snapshot
        uses: actions/upload-artifact@v4
        with:
          name: metrics-snapshot
          path: |
            metrics-current.json
            metrics-current.md

      - name: Ratchet check against baseline
        run: python3 scripts/metrics.py ratchet --baseline docs/roadmap/metrics/metrics.baseline.json --current metrics-current.json
