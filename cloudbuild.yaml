steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        apt-get update && apt-get install -y python3 python3-pip wget docker.io
        
        # Install Helm
        wget https://get.helm.sh/helm-v3.12.0-linux-amd64.tar.gz
        tar -zxvf helm-v3.12.0-linux-amd64.tar.gz
        mv linux-amd64/helm /usr/local/bin/helm
        
        # Get credentials for cluster
        export USE_GKE_GCLOUD_AUTH_PLUGIN=True
        gcloud container clusters get-credentials mvk-benchmark --zone us-central1-a --project gen-lang-client-0625573011
        
        # Configure Docker auth
        gcloud auth configure-docker --quiet
        
        # Run test suite wrapper
        export GCP_PROJECT_ID=gen-lang-client-0625573011
        python3 run_suite.py

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s
