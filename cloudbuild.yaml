steps:
  # Build the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/rust-linux-mini-kernel:v8.4.0-beta', '-f', 'azure_build/Dockerfile.with-code', '.']
  
  # Run the benchmarks
  - name: 'gcr.io/$PROJECT_ID/rust-linux-mini-kernel:v8.4.0-beta'
    entrypoint: '/bin/bash'
    args: ['-c', '/usr/local/bin/benchmark_suite.sh || true']
    
  # Validate MVK Boot Sequence (64-bit x86_64)
  - name: 'gcr.io/$PROJECT_ID/rust-linux-mini-kernel:v8.4.0-beta'
    entrypoint: '/bin/bash'
    args: 
      - '-c'
      - |
        apt-get update && apt-get install -y gcc-multilib qemu-system-x86 nasm binutils xz-utils wget unzip lld
        
        # Install x86_64-elf-ld for linking bare metal
        wget https://github.com/lordmilko/i686-elf-tools/releases/download/7.1.0/x86_64-elf-tools-linux.zip
        unzip x86_64-elf-tools-linux.zip -d /usr/local/
        export PATH=$$PATH:/usr/local/x86_64-elf/bin
        
        rustup target add x86_64-unknown-none
        
        # Build 64-bit kernel
        chmod +x build_kernel.sh
        ./build_kernel.sh
        
        # Validate Boot on GCP Hardware (x86_64 QEMU)
        timeout 2 qemu-system-x86_64 -kernel build/mvk-kernel.elf -display none -serial stdio || [ $$? -eq 124 ]

images:
  - 'gcr.io/$PROJECT_ID/rust-linux-mini-kernel:v8.4.0-beta'
